<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E2A2B">
<title>محلات — متطلبات التطوير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* محلات — وثيقة المتطلبات · نظام التصميم */
:root{
  --paper:#F3F6F5;--surface:#FFFFFF;--sunk:#EAF0EE;
  --ink:#10282A;--ink-2:#45595A;--ink-3:#7A8B8A;
  --line:#DCE4E1;--line-2:#C9D4D0;
  --brand:#0A6B5C;--brand-strong:#07493F;--brand-tint:#E1F0EB;
  --saffron:#D9901F;--saffron-ink:#8A5A0E;--saffron-tint:#FBF0DB;
  --rose:#BF3349;--rose-tint:#FBE6E9;
  --sky:#2A6AAE;--sky-tint:#E5EEF8;
  --violet:#6B4FB0;--violet-tint:#EEEAF8;
  --rail:#0E2A2B;--rail-ink:#CFE0DC;--rail-dim:#86A3A0;
  --shadow-1:0 1px 2px rgba(16,40,42,.06);
  --shadow-2:0 18px 40px -18px rgba(16,40,42,.28);
  --r-s:8px;--r-m:12px;--r-l:18px;
  --f-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --rail-w:268px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1717;--surface:#122020;--sunk:#0F1C1C;
  --ink:#E4EEEC;--ink-2:#A9BCB9;--ink-3:#7D9290;
  --line:#22393A;--line-2:#2E4A4A;
  --brand:#3DB89F;--brand-strong:#7FD8C3;--brand-tint:#143A33;
  --saffron:#F0B456;--saffron-ink:#F3C77E;--saffron-tint:#3A2C14;
  --rose:#F07C8F;--rose-tint:#3D1A21;--sky:#7DB1EA;--sky-tint:#15283C;--violet:#B5A0F0;--violet-tint:#251E3A;
  --rail:#081212;--shadow-2:0 18px 40px -18px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1717;--surface:#122020;--sunk:#0F1C1C;
  --ink:#E4EEEC;--ink-2:#A9BCB9;--ink-3:#7D9290;
  --line:#22393A;--line-2:#2E4A4A;
  --brand:#3DB89F;--brand-strong:#7FD8C3;--brand-tint:#143A33;
  --saffron:#F0B456;--saffron-ink:#F3C77E;--saffron-tint:#3A2C14;
  --rose:#F07C8F;--rose-tint:#3D1A21;--sky:#7DB1EA;--sky-tint:#15283C;--violet:#B5A0F0;--violet-tint:#251E3A;
  --rail:#081212;--shadow-2:0 18px 40px -18px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.75 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:4px}
.ltr{direction:ltr;unicode-bidi:isolate}
.id{font:600 12px/1 var(--f-display);direction:ltr;unicode-bidi:isolate;letter-spacing:.2px;color:var(--brand)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;color:var(--ink);margin:0}
h1{font-size:34px;line-height:1.35;letter-spacing:-.3px}
h2{font-size:22px;line-height:1.45}
h3{font-size:16px;line-height:1.5}
h4{font-size:14px;line-height:1.5}
p{margin:0}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ───────── Rail (sidebar) ───────── */
#rail{position:fixed;inset:0 0 0 auto;width:var(--rail-w);background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;z-index:40}
.rail-brand{display:flex;align-items:center;gap:12px;padding:22px 22px 18px;color:#fff;text-decoration:none}
.rail-brand:hover{text-decoration:none}
.mark{width:40px;height:40px;border-radius:12px 12px 12px 4px;background:var(--saffron);display:grid;place-items:center;color:#2A1B03;font:700 22px/1 var(--f-display)}
.rail-brand b{display:block;font:600 21px/1.2 var(--f-display)}
.rail-brand small{display:block;font-size:12px;color:var(--rail-dim)}
.rail-scroll{flex:1;overflow:auto;padding:4px 12px 16px}
.rail-group{margin-top:16px}
.rail-group>span{display:block;font-size:12px;color:var(--rail-dim);padding:0 12px 6px}
.rail a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--rail-ink);font-size:14px;text-decoration:none}
.rail a:hover{background:rgba(255,255,255,.06)}
.rail a.active{background:rgba(61,184,159,.16);color:#fff;box-shadow:inset -3px 0 0 var(--saffron)}
.rail a svg{width:18px;height:18px;flex:none;opacity:.85}
.rail a .count{margin-inline-start:auto;font:500 11px/1 var(--f-display);color:var(--rail-dim);background:rgba(255,255,255,.07);padding:4px 7px;border-radius:20px}
.rail-foot{border-top:1px solid rgba(255,255,255,.08);padding:14px 22px 18px;font-size:12px;color:var(--rail-dim)}
.rail-foot b{display:block;color:var(--rail-ink);font-weight:500;font-size:13px}
.rail-foot a{display:inline-flex;gap:6px;align-items:center;margin-top:10px;color:var(--saffron);font-size:13px}
.rail-close{display:none}

/* ───────── Top bar ───────── */
.shell{margin-right:var(--rail-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:14px;padding:0 32px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumbs{font-size:13px;color:var(--ink-3);display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:500}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.search{position:relative;display:flex;align-items:center;gap:8px;width:340px;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.search svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.search input{flex:1;border:0;outline:0;background:none;font-size:14px;min-width:0}
.search kbd{font:11px var(--f-display);color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;direction:ltr}
.icon-btn{height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.icon-btn:hover{border-color:var(--line-2);background:var(--sunk)}
.icon-btn svg{width:18px;height:18px}
#menu{display:none}
.results{position:absolute;top:46px;inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);max-height:70vh;overflow:auto;padding:6px;display:none;z-index:50}
.results.open{display:block}
.results h6{margin:8px 10px 4px;font:500 12px var(--f-body);color:var(--ink-3)}
.results a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;color:var(--ink);font-size:14px;text-decoration:none}
.results a:hover,.results a.hl{background:var(--sunk)}
.results a .id{min-width:62px}
.results small{color:var(--ink-3);font-size:12px;margin-inline-start:auto}
.results .none{padding:14px;color:var(--ink-3);font-size:14px}

main{flex:1;width:100%;max-width:1440px;margin:0 auto;padding:36px 32px 64px}
footer{padding:20px 32px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}

/* ───────── Shared doc components ───────── */
.head{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap}
.head p{max-width:68ch;color:var(--ink-2);margin-top:8px}
.kicker{font-size:13px;color:var(--brand);font-weight:500;margin-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.launch{background:var(--brand-tint);color:var(--brand)}
.pill.important{background:var(--saffron-tint);color:var(--saffron-ink)}
.pill.later{background:var(--sunk);color:var(--ink-2)}
.pill.foundation{background:var(--violet-tint);color:var(--violet)}
.pill.plain::before{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.section{margin-top:44px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.section-h small{color:var(--ink-3);font-size:13px}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--brand-tint);color:var(--ink);font-size:14px;margin:16px 0}
.note svg{width:20px;height:20px;flex:none;color:var(--brand);margin-top:3px}
.note.amber{background:var(--saffron-tint)}
.note.amber svg{color:var(--saffron-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .n{font:500 11px var(--f-display);opacity:.7}
.table-wrap{border:1px solid var(--line);border-radius:var(--r-m);overflow:auto;background:var(--surface)}
table.doc{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
table.doc th{text-align:right;font-weight:500;color:var(--ink-3);font-size:13px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
table.doc td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
table.doc tr:last-child td{border-bottom:0}
table.doc td:first-child{font-weight:500}
.btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn svg{width:16px;height:16px}

/* ───────── Overview ───────── */
.ov-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:center;padding:40px;border-radius:24px;background:var(--rail);color:#E7F1EE;position:relative;overflow:hidden}
.ov-hero h1{color:#fff;font-size:40px;line-height:1.3}
.ov-hero p{color:#B9CEC9;margin-top:14px;max-width:56ch}
.ov-hero .scope{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.ov-hero .scope span{font-size:13px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.08);color:#DCEAE6}
.ov-hero .scope span.f{background:rgba(181,160,240,.18);color:#D9CCFF}
.ov-map{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ov-map a{display:block;padding:16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;text-decoration:none}
.ov-map a:hover{background:rgba(255,255,255,.1)}
.ov-map b{display:block;font:600 15px var(--f-display)}
.ov-map small{display:block;color:#9FBAB4;font-size:12px;margin-top:2px}
.ov-map .big{font:500 30px/1.1 var(--f-display);color:var(--saffron);margin-top:12px;display:block}
.ov-map .big em{font-style:normal;font-size:13px;color:#9FBAB4;margin-inline-start:6px}
.ov-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.store-type{padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.store-type .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
.store-type .ic svg{width:22px;height:22px}
.store-type h3{font-size:16px}
.store-type p{font-size:14px;color:var(--ink-2);margin-top:2px}
.prio-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--sunk);margin:12px 0}
.prio-bar i{display:block}
.prio-legend{display:flex;flex-wrap:wrap;gap:18px;font-size:14px}
.prio-legend span{display:flex;align-items:center;gap:8px}
.prio-legend i{width:10px;height:10px;border-radius:3px;display:block}
.prio-legend b{font:600 15px var(--f-display)}
.group-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.group-list a{display:block;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.group-list a:hover{border-color:var(--brand)}
.group-list b{font:500 26px/1.2 var(--f-display);color:var(--brand);display:block}
.group-list span{font-size:14px;display:block;margin-top:4px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;counter-reset:s}
.howto div{padding:18px;border-radius:14px;border:1px dashed var(--line-2)}
.howto div::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);font:600 13px var(--f-display);margin-bottom:10px}
.howto p{font-size:14px;color:var(--ink-2)}
.open-items{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.open-items article{padding:18px;border-radius:14px;background:var(--saffron-tint)}
.open-items .id{color:var(--saffron-ink)}
.open-items h3{margin:6px 0}
.open-items p{font-size:14px;color:var(--ink-2)}

/* ───────── Requirements ───────── */
.req-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.req-side{position:sticky;top:84px;display:grid;gap:18px}
.req-side h6{margin:0 0 6px;font:500 13px var(--f-body);color:var(--ink-3)}
.vlist{display:grid;gap:2px}
.vlist button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;text-align:right;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--ink-2)}
.vlist button:hover{background:var(--sunk)}
.vlist button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line)}
.vlist .n{font:500 12px var(--f-display);color:var(--ink-3)}
.req-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.req-tools .found{font-size:14px;color:var(--ink-3)}
.req-group-h{display:flex;align-items:baseline;gap:12px;margin:28px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.req-group-h:first-child{margin-top:0}
.req-group-h small{color:var(--ink-3);font-size:13px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;scroll-margin-top:84px}
.req>summary{display:grid;grid-template-columns:78px minmax(0,1fr) auto 20px;gap:14px;align-items:center;padding:14px 18px;cursor:pointer;list-style:none}
.req>summary::-webkit-details-marker{display:none}
.req>summary .t{font-weight:500;font-size:15px}
.req>summary .chev{width:18px;height:18px;color:var(--ink-3);transition:transform .15s}
.req[open]>summary .chev{transform:rotate(180deg)}
.req[open]{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.req-body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;padding:4px 18px 18px 18px;margin-inline-start:92px}
.req-body h5{margin:0 0 6px;font:500 13px var(--f-body);color:var(--ink-3)}
.req-body ul{margin:0;padding-inline-start:18px}
.req-body li{margin:4px 0;font-size:14px}
.req-body li::marker{color:var(--ink-3)}
.accept{background:var(--brand-tint);border-radius:12px;padding:12px 14px}
.accept h5{color:var(--brand)}
.accept li{list-style:none;position:relative;padding-inline-start:4px}
.accept ul{padding-inline-start:18px}
.accept li::before{content:"";position:absolute;inset-inline-start:-16px;top:9px;width:9px;height:5px;border-left:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(-45deg)}
.req-used{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-3)}
.req-used a{font-size:13px;padding:2px 10px;border-radius:20px;background:var(--sunk);color:var(--ink);text-decoration:none}
.req-used a:hover{background:var(--brand-tint)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--saffron)}100%{box-shadow:0 0 0 0 transparent}}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:14px}

/* ───────── Surface explorer ───────── */
.explorer{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.plist{position:sticky;top:84px;max-height:calc(100vh - 104px);overflow:auto;padding-inline-end:4px}
.plist-filter{display:flex;align-items:center;gap:8px;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);margin-bottom:10px}
.plist-filter svg{width:16px;height:16px;color:var(--ink-3)}
.plist-filter input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:14px}
.plist a{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;color:var(--ink-2);font-size:14px;text-decoration:none}
.plist a:hover{background:var(--sunk);text-decoration:none}
.plist a.active{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line)}
.plist a .id{font-size:12px;color:var(--ink-3)}
.plist a.active .id{color:var(--brand)}
.plist a i{width:7px;height:7px;border-radius:50%}
.plist-select{display:none}
.explorer.wide{grid-template-columns:minmax(0,1fr)}
.explorer.wide .plist{position:static;max-height:none;display:flex;gap:10px;align-items:center}
.explorer.wide .plist nav,.explorer.wide .plist-filter{display:none}
.explorer.wide .plist-select{display:block;max-width:420px;width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);font-size:15px}
.explorer.wide .plist small{color:var(--ink-3);font-size:13px}
.page-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.page-h h2{font-size:26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-h p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.pager{display:flex;gap:6px}
.pager a{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);text-decoration:none}
.pager a:hover{background:var(--sunk)}
.pager a[aria-disabled="true"]{opacity:.4;pointer-events:none}
.pager svg{width:14px;height:14px}
.workbench{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.workbench.wide{grid-template-columns:minmax(0,1fr)}
.stage{position:relative;border-radius:22px;padding:24px;background:
  radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/18px 18px,var(--sunk);border:1px solid var(--line)}
.stage-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);margin-bottom:14px}
.stage-cap span{display:inline-flex;gap:6px;align-items:center}
.stage-cap svg{width:14px;height:14px}
.spec{display:grid;gap:12px}
.wide .spec{grid-template-columns:repeat(3,minmax(0,1fr))}
.spec-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.spec-card h3{font-size:14px;color:var(--ink-3);font-weight:500;font-family:var(--f-body);margin-bottom:8px;display:flex;justify-content:space-between}
.spec-card ul{margin:0;padding-inline-start:18px;font-size:14px}
.spec-card li{margin:3px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:3px 10px;border-radius:8px;background:var(--sunk);border:0;color:var(--ink)}
button.tag:hover,a.tag:hover{background:var(--brand-tint);text-decoration:none}
.tag.id{font-size:12px;padding:5px 9px}
.linked-reqs{margin-top:36px}

/* ───────── Finance / settings / reports / quality ───────── */
.fin-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.calc{padding:22px}
.calc .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field label{display:block;font-size:13px;color:var(--ink-3);margin-bottom:4px}
.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper);font-size:15px}
.receipt{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;position:sticky;top:84px}
.receipt small{color:var(--ink-3);font-size:13px}
.receipt .big{unicode-bidi:plaintext;font:600 34px/1.2 var(--f-display);color:var(--brand);margin:4px 0 12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-of-type{border-bottom:0}
.row b{font:500 14px var(--f-display);unicode-bidi:plaintext}
.ex-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ex-cards article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ex-cards h3{font-size:15px;margin-bottom:10px}
.ex-cards dl{margin:0;display:grid;gap:8px}
.ex-cards dt{font-size:12px;color:var(--ink-3)}
.ex-cards dd{margin:0;font-size:14px}
.set-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.set-grid article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px}
.set-grid h3{font:500 14px var(--f-body);color:var(--ink-2)}
.set-grid .v{font:600 15px/1.5 var(--f-display);color:var(--ink);grid-column:1/-1}
.set-grid p{grid-column:1/-1;font-size:13px;color:var(--ink-3)}
.integr{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.integr article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.integr b{font:600 15px var(--f-display);display:block}
.integr p{font-size:13px;color:var(--ink-2);margin:4px 0 8px}
.rep-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.rep-group{margin-bottom:18px}
.rep-group h4{font:500 13px var(--f-body);color:var(--ink-3);margin-bottom:6px}
.rep-item{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rep-item b{font-weight:500}
.rep-item span{color:var(--ink-2)}
.q-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;counter-reset:q}
.q-list article{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:14px}
.q-list article::before{counter-increment:q;content:counter(q);display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--brand-tint);color:var(--brand);font:600 13px var(--f-display)}

/* diagrams */
.dg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dg-stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;height:min(68vh,640px);cursor:grab;touch-action:none}
.dg-stage.dragging{cursor:grabbing}
.dg-stage svg{position:absolute;top:0;left:0;transform-origin:0 0;direction:ltr;font-family:var(--f-body)}
.dg-zoom{position:absolute;bottom:12px;left:12px;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:2}
.dg-zoom button{width:32px;height:32px;border:0;background:none;border-radius:7px;font-size:16px}
.dg-zoom button:hover{background:var(--sunk)}
.dg-stage .c-grid{fill:none;stroke:var(--line);opacity:.35}.dg-stage .c-mask{fill:var(--surface);stroke:none}
.dg-stage .c-lane{fill:var(--paper);stroke:var(--line-2);stroke-dasharray:6 6}
.dg-stage .c-security-group{fill:transparent;stroke:var(--saffron);stroke-dasharray:4 4}
.dg-stage .c-frontend,.dg-stage .c-backend{fill:var(--brand-tint);stroke:var(--brand)}
.dg-stage .c-database,.dg-stage .c-messagebus,.dg-stage .c-security{fill:var(--saffron-tint);stroke:var(--saffron)}
.dg-stage .t-primary{fill:var(--ink)}.dg-stage .t-muted,.dg-stage .t-dim{fill:var(--ink-3)}
.dg-stage .t-database,.dg-stage .t-security{fill:var(--saffron-ink)}
.dg-stage .a-default{stroke:var(--ink-3);fill:none}.dg-stage .a-dashed{stroke:var(--saffron);fill:none;stroke-dasharray:5 5}
.dg-stage .m-default{fill:var(--ink-3)}.dg-stage .m-dashed,.dg-stage .m-security,.dg-stage .m-emphasis{fill:var(--saffron)}
.dg-stage .semantic-sigil{color:var(--brand);stroke:var(--brand);fill:none}.dg-stage .sigil-fill{fill:var(--brand);stroke:none}

#toast{position:fixed;bottom:22px;left:22px;max-width:420px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:14px;z-index:90;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}
#toast.show{opacity:1;transform:none}

/* ══════════════ MOCKUPS ══════════════
   Mock screens keep their own product palette (independent of doc theme) */
.mk{--m-bg:#F6F8F7;--m-card:#fff;--m-ink:#132C2B;--m-2:#5A6D6B;--m-3:#94A3A1;--m-line:#E6ECEA;
  --m-brand:#0A6B5C;--m-brand-2:#0E8A75;--m-tint:#E3F2EE;--m-sun:#F2A93B;--m-sun-tint:#FDF1DC;--m-red:#D64045;--m-red-tint:#FDE8E8;--m-blue:#2E6FD8;--m-blue-tint:#E7EFFC;
  color:var(--m-ink);font:13px/1.55 var(--f-body);text-align:right}
.mk *{box-sizing:border-box}
.mk button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.mk input,.mk select,.mk textarea{font:inherit;color:var(--m-ink)}
.mk .num{font-family:var(--f-display);unicode-bidi:plaintext}
.mk svg{width:18px;height:18px;flex:none}
.mk svg.chart{width:100%;height:auto}

/* phone */
.phone{width:360px;height:740px;margin:0 auto;border-radius:46px;padding:10px;background:#0B1414;box-shadow:var(--shadow-2),inset 0 0 0 2px #2A3A3A}
.phone .scr{position:relative;height:100%;border-radius:37px;overflow:hidden;background:var(--m-bg);display:flex;flex-direction:column}
.phone .sb{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 4px;font:600 12px var(--f-display);direction:ltr;flex:none}
.phone .sb i{display:block;width:96px;height:26px;border-radius:20px;background:#0B1414;position:absolute;left:50%;top:9px;transform:translateX(-50%)}
.phone .sb span:last-child{display:flex;gap:4px;align-items:center}
.phone .sb svg{width:15px;height:15px}
.phone .body{flex:1;overflow:auto;padding:4px 16px 18px;scrollbar-width:none}
.phone .body::-webkit-scrollbar{display:none}
.phone .appbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex:none}
.phone .appbar h4{font:600 18px/1.3 var(--f-display);color:var(--m-ink);flex:1}
.phone .appbar small{display:block;font:400 11px var(--f-body);color:var(--m-3)}
.phone .appbar .ib{width:36px;height:36px;border-radius:50%;background:var(--m-card);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.phone .tabbar{flex:none;display:flex;justify-content:space-around;padding:8px 6px 18px;background:var(--m-card);border-top:1px solid var(--m-line)}
.phone .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--m-3);min-width:60px}
.phone .tabbar button.on{color:var(--m-brand);font-weight:600}
.phone .tabbar svg{width:22px;height:22px}
.phone .sticky{flex:none;padding:12px 16px 14px;background:var(--m-card);border-top:1px solid var(--m-line)}
/* driver dark variant */
.phone.drv .scr{--m-bg:#0F1A1C;--m-card:#18272A;--m-ink:#EAF2F0;--m-2:#A6B8B5;--m-3:#6F8582;--m-line:#25393C;--m-tint:#163B35;--m-brand:#35C2A6;--m-brand-2:#35C2A6;--m-sun-tint:#3A2C12;--m-red-tint:#3B1B1D;--m-blue-tint:#162A44;color:var(--m-ink)}
.phone.drv .sb i{background:#000}
/* merchant tint */
.phone.mer .scr{--m-brand:#11433D;--m-brand-2:#0A6B5C}

/* mock primitives */
.m-card{background:var(--m-card);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,40,42,.05)}
.phone.drv .m-card{box-shadow:none;border:1px solid var(--m-line)}
.m-h{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.m-h b{font:600 15px var(--f-display)}
.m-h a,.m-h span{font-size:12px;color:var(--m-brand)}
.m-sub{font-size:11px;color:var(--m-3)}
.m-search{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:14px;background:var(--m-card);color:var(--m-3);box-shadow:0 1px 2px rgba(16,40,42,.05);width:100%;margin-bottom:10px}
.m-search input{border:0;outline:0;background:none;flex:1;min-width:0}
.m-addr{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:10px;text-align:right}
.m-addr .pin{width:34px;height:34px;border-radius:50%;background:var(--m-tint);color:var(--m-brand);display:grid;place-items:center}
.m-addr small{display:block;color:var(--m-3);font-size:11px}
.m-addr b{font-size:13px}
.m-chips{display:flex;gap:6px;overflow:auto;scrollbar-width:none;margin-bottom:10px}
.m-chips::-webkit-scrollbar{display:none}
.m-chip{flex:none;height:30px;padding:0 12px;border-radius:15px;background:var(--m-card);border:1px solid var(--m-line)!important;font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.m-chip.on{background:var(--m-ink)!important;color:var(--m-card);border-color:var(--m-ink)!important}
.phone.drv .m-chip.on{background:var(--m-brand)!important;color:#05211C}
.m-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}
.m-cats button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.m-cats .ic{width:62px;height:62px;border-radius:20px;display:grid;place-items:center}
.m-cats .ic svg{width:28px;height:28px}
.m-banner{border-radius:18px;padding:16px;color:#fff;background:linear-gradient(120deg,#0A6B5C,#0E8A75 60%,#13A086);position:relative;overflow:hidden;margin-bottom:12px}
.m-banner small{display:block;font-size:11px;opacity:.8}
.m-banner b{display:block;font:600 19px/1.35 var(--f-display);margin:2px 0}
.m-banner::after{content:"";position:absolute;left:-36px;bottom:-56px;width:150px;height:150px;border-radius:50%;border:26px solid rgba(255,255,255,.08)}
.m-banner.sun{background:linear-gradient(120deg,#E68F12,#F2A93B);color:#2B1A02}
.m-banner.sun::after{border-color:rgba(255,255,255,.22)}
.m-banner.ink{background:#132C2B}
.m-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--m-line);width:100%;text-align:right}
.m-row:last-child{border-bottom:0}
.m-row .grow{flex:1;min-width:0}
.m-row b{display:block;font-size:13px;font-weight:600}
.m-row small{display:block;color:var(--m-3);font-size:11px}
.m-row .end{font:600 13px var(--f-display);white-space:nowrap}
.m-thumb{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;font:700 18px var(--f-display);color:rgba(0,0,0,.45)}
.m-thumb.sm{width:40px;height:40px;border-radius:12px;font-size:14px}
.m-store{display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:10px;background:var(--m-card);border-radius:16px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,40,42,.05)}
.m-store .grow{flex:1;min-width:0}
.m-store b{display:block;font-size:14px;font-weight:600}
.m-store small{display:block;color:var(--m-3);font-size:11px}
.m-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--m-2);margin-top:3px}
.m-meta span{display:inline-flex;align-items:center;gap:3px}
.m-meta svg{width:13px;height:13px}
.m-tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:500;background:var(--m-tint);color:var(--m-brand);white-space:nowrap}
.m-tag.sun{background:var(--m-sun-tint);color:#9A5F06}
.m-tag.red{background:var(--m-red-tint);color:var(--m-red)}
.m-tag.blue{background:var(--m-blue-tint);color:var(--m-blue)}
.m-tag.gray{background:var(--m-bg);color:var(--m-2)}
.phone.drv .m-tag.sun{color:#F3C77E}
.m-hscroll{display:flex;gap:10px;overflow:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.m-hscroll::-webkit-scrollbar{display:none}
.m-tile{flex:none;width:150px;text-align:right}
.m-tile .img{height:92px;border-radius:14px;margin-bottom:6px;position:relative}
.m-tile .img .m-tag{position:absolute;top:8px;right:8px}
.m-tile b{display:block;font-size:13px}
.m-tile small{display:block;color:var(--m-3);font-size:11px}
.m-btn{height:46px;border-radius:14px!important;background:var(--m-brand)!important;color:#fff!important;font-weight:600!important;display:flex!important;align-items:center;justify-content:center;gap:8px;width:100%}
.phone.drv .m-btn{color:#05211C!important}
.phone.drv .m-btn.ghost{color:var(--m-ink)!important}
.phone.drv .m-btn.red{color:#F07C8F!important}
.m-cover.m-hatch{background:repeating-linear-gradient(-45deg,#E7EFEC 0 8px,#F1F6F4 8px 16px)}
.m-btn.ghost{background:var(--m-card)!important;color:var(--m-ink)!important;border:1px solid var(--m-line)!important}
.m-btn.sun{background:var(--m-sun)!important;color:#2B1A02!important}
.m-btn.red{background:var(--m-red-tint)!important;color:var(--m-red)!important}
.m-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-btn.sm{height:38px;font-size:12px}
.m-field{display:block;margin-bottom:10px}
.m-field>span{display:block;font-size:11px;color:var(--m-2);margin-bottom:4px}
.m-field input,.m-field select,.m-field textarea{width:100%;height:42px;border:1px solid var(--m-line);border-radius:12px;padding:0 12px;background:var(--m-card);outline:0}
.m-field textarea{height:auto;min-height:110px;padding:10px 12px;resize:vertical}
.m-field input:focus,.m-field select:focus,.m-field textarea:focus{border-color:var(--m-brand)}
.m-check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--m-line);font-size:13px}
.m-check:last-child{border-bottom:0}
.m-check input{width:18px;height:18px;accent-color:var(--m-brand)}
.m-sum .r{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--m-2)}
.m-sum .r b{color:var(--m-ink);font:500 13px var(--f-display);unicode-bidi:plaintext}
.m-sum .r.t{border-top:1px dashed var(--m-line);margin-top:6px;padding-top:10px;color:var(--m-ink);font-weight:600}
.m-sum .r.t b{font-size:16px;font-weight:600}
.m-note{font-size:11px;padding:10px 12px;border-radius:12px;background:var(--m-sun-tint);color:#7A4B05;margin:10px 0;display:flex;gap:8px}
.m-note svg{width:16px;height:16px;flex:none;margin-top:1px}
.phone.drv .m-note{color:#F3C77E}
.m-note.info{background:var(--m-tint);color:var(--m-brand)}
.m-seg{display:flex;background:var(--m-line);border-radius:12px;padding:3px;margin-bottom:10px}
.m-seg button{flex:1;height:32px;border-radius:9px;font-size:12px;color:var(--m-2)}
.m-seg button.on{background:var(--m-card);color:var(--m-ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.m-toggle{width:42px;height:24px;border-radius:12px;background:var(--m-line);position:relative;flex:none}
.m-toggle::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.m-toggle.on{background:var(--m-brand)}
.m-toggle.on::after{right:21px}
.m-stepper{display:flex;align-items:center;gap:10px;background:var(--m-bg);border-radius:12px;padding:4px}
.m-stepper button{width:30px;height:30px;border-radius:9px;background:var(--m-card);display:grid;place-items:center;font-size:16px}
.m-stepper b{min-width:18px;text-align:center;font-family:var(--f-display)}
.m-progress{height:6px;border-radius:3px;background:var(--m-line);overflow:hidden}
.m-progress i{display:block;height:100%;background:var(--m-brand);border-radius:3px}
.m-progress.sun i{background:var(--m-sun)}
.m-timeline{position:relative;padding-inline-start:4px}
.m-step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.m-step:last-child{padding-bottom:0}
.m-step::before{content:"";position:absolute;right:11px;top:22px;bottom:0;width:2px;background:var(--m-line)}
.m-step:last-child::before{display:none}
.m-step .dot{width:24px;height:24px;border-radius:50%;background:var(--m-line);display:grid;place-items:center;flex:none;color:#fff;z-index:1}
.m-step .dot svg{width:13px;height:13px}
.m-step.done .dot{background:var(--m-brand)}
.m-step.done::before{background:var(--m-brand)}
.m-step.now .dot{background:var(--m-sun);box-shadow:0 0 0 5px var(--m-sun-tint)}
.m-step b{font-size:13px;display:block}
.m-step small{font-size:11px;color:var(--m-3)}
.m-map{position:relative;height:210px;border-radius:18px;overflow:hidden;background:#E8EEE9;margin-bottom:10px}
.m-map svg.base{position:absolute;inset:0;width:100%;height:100%}
.m-map.full{height:auto;flex:1;border-radius:0;margin:0}
.m-pin{position:absolute;transform:translate(50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600}
.m-pin i{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.m-pin i svg{transform:rotate(45deg);width:15px;height:15px;color:#fff}
.m-pin span{background:#fff;color:#132C2B;padding:1px 7px;border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.15);white-space:nowrap}
.phone.drv .m-map{background:#16262A}
.m-timer{display:grid;place-items:center;text-align:center;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--m-sun) var(--p,70%),var(--m-line) 0);margin:0 auto}
.m-timer>div{width:70px;height:70px;border-radius:50%;background:var(--m-card);display:grid;place-items:center;font:600 18px/1 var(--f-display)}
.m-timer small{display:block;font:400 10px var(--f-body);color:var(--m-3)}
.m-code{font:700 40px/1 var(--f-display);letter-spacing:10px;direction:ltr;text-align:center;margin:12px 0;color:var(--m-ink)}
.m-stars{display:flex;gap:4px;color:var(--m-sun);direction:ltr;justify-content:flex-end}
.m-stars svg{width:24px;height:24px}
.m-stars.sm svg{width:14px;height:14px}
.m-stars .off{color:var(--m-line)}
.m-bubble{max-width:82%;padding:8px 12px;border-radius:14px;font-size:12px;margin-bottom:6px;background:var(--m-card)}
.m-bubble.me{background:var(--m-brand);color:#fff;margin-inline-start:auto;border-bottom-left-radius:4px}
.m-bubble.them{border-bottom-right-radius:4px}
.m-hero-num{font:600 32px/1.15 var(--f-display);unicode-bidi:plaintext}
.m-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.m-kpis>div{background:var(--m-card);border-radius:14px;padding:10px 12px}
.m-kpis small{display:block;font-size:11px;color:var(--m-3)}
.m-kpis b{font:600 18px var(--f-display)}

.mk .d-btn{height:32px;padding:0 12px;border-radius:9px!important;border:1px solid var(--m-line)!important;background:#fff!important;font-size:12px;display:inline-flex!important;align-items:center;gap:6px;white-space:nowrap}

.d-table td{padding:9px 10px;border-bottom:1px solid var(--m-line);white-space:nowrap}

.d-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}

.d-bar .num{text-align:left;font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:#EEF2F1}
.chart .ln{fill:none;stroke:var(--m-brand);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:#B7C4C1;stroke-width:2;stroke-dasharray:4 4}
.chart .ar{fill:url(#gA)}
.chart text{font:10px var(--f-display);fill:#94A3A1}
.chart .bar{fill:var(--m-brand)}
.chart .bar.b{fill:#BFD9D2}
.d-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-display);color:#fff;flex:none}
.d-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500}
.d-status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:#0A7F5C}.warn{color:#B86E00}.bad{color:#C8343B}.info{color:#2E6FD8}.idle{color:#7E8F8D}
.d-split{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:420px;border:1px solid var(--m-line);border-radius:12px;overflow:hidden;background:#fff}
.d-split>.l{border-inline-end:1px solid var(--m-line);overflow:auto}
.d-split>.l .it{padding:10px 14px;border-bottom:1px solid var(--m-line);display:block;width:100%;text-align:right}
.d-split>.l .it.on{background:var(--m-tint)}
.d-split>.l .it b{font-size:12px;display:flex;justify-content:space-between;gap:6px}
.d-split>.l .it small{display:block;font-size:11px;color:var(--m-3)}
.d-split>.r{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.d-matrix{width:100%;border-collapse:collapse;font-size:12px}
.d-matrix th,.d-matrix td{padding:8px;border-bottom:1px solid var(--m-line);text-align:center}
.d-matrix th:first-child,.d-matrix td:first-child{text-align:right}
.d-matrix input{accent-color:var(--m-brand)}
.d-waterfall .w{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:12px;padding:5px 0}
.d-waterfall .w .tr{height:20px;position:relative}
.d-waterfall .w .tr i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--m-brand)}
.d-waterfall .w.neg .tr i{background:#E7A5A8}
.d-waterfall .w.tot{border-top:1px solid var(--m-line);margin-top:4px;padding-top:9px;font-weight:600}
.d-waterfall .w .num{text-align:left}

.d-map svg.base{position:absolute;inset:0;width:100%;height:100%}
.d-timeline .ev{display:grid;grid-template-columns:52px 14px minmax(0,1fr);gap:8px;font-size:12px;padding:5px 0;align-items:start}
.d-timeline .ev time{color:var(--m-3);font-family:var(--f-display);unicode-bidi:plaintext;text-align:left}
.d-timeline .ev i{width:10px;height:10px;border-radius:50%;background:var(--m-brand);margin-top:5px;box-shadow:0 0 0 3px var(--m-tint)}
.d-timeline .ev.w i{background:var(--m-sun);box-shadow:0 0 0 3px var(--m-sun-tint)}
.d-place{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.d-place>div{border:1px solid var(--m-line);border-radius:12px;padding:10px;background:#fff}
.d-place .pv{height:70px;border-radius:8px;margin-bottom:8px;display:grid;place-items:center;font-size:11px;color:var(--m-2)}
.d-place b{font-size:12px;display:block}
.d-place small{font-size:11px;color:var(--m-3)}
.d-dropzone{border:1.5px dashed var(--m-line);border-radius:12px;padding:18px;text-align:center;color:var(--m-2);font-size:12px;background:var(--m-bg)}
.d-ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.d-ba>div{border-radius:10px;padding:10px;font-size:12px}
.d-ba .b{background:var(--m-red-tint)}
.d-ba .a{background:var(--m-tint)}
.d-ba small{display:block;color:var(--m-3);font-size:11px}
.d-ba b{font-family:var(--f-display)}

}
@media (max-width:420px){

}

function setupDiagram(){const st=$('#dg');if(!st)return;const svg=$('svg',st);if(!svg)return;
 const vb=(svg.getAttribute('viewBox')||svg.getAttribute('viewbox')||'0 0 1000 500').split(/\s+/).map(Number);const W=vb[2],H=vb[3];svg.setAttribute('width',W);svg.setAttribute('height',H);
 let s=1,x=0,y=0;const apply=()=>svg.style.transform=`translate(${x}px,${y}px) scale(${s})`;
 const fit=()=>{const r=st.getBoundingClientRect();s=Math.min(r.width/W,r.height/H)*.94;x=(r.width-W*s)/2;y=(r.height-H*s)/2;apply();};fit();
 const zoom=(f,cx,cy)=>{const r=st.getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;const ns=Math.max(.2,Math.min(4,s*f));x=cx-(cx-x)*ns/s;y=cy-(cy-y)*ns/s;s=ns;apply();};
 st.onwheel=e=>{e.preventDefault();const r=st.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);};
 let drag=null;st.onpointerdown=e=>{if(e.target.closest('.dg-zoom'))return;drag={sx:e.clientX-x,sy:e.clientY-y};st.classList.add('dragging');st.setPointerCapture(e.pointerId);};
 st.onpointermove=e=>{if(!drag)return;x=e.clientX-drag.sx;y=e.clientY-drag.sy;apply();};
 st.onpointerup=()=>{drag=null;st.classList.remove('dragging');};
 $$('[data-z]',st).forEach(b=>b.onclick=()=>b.dataset.z==='fit'?fit():zoom(b.dataset.z==='in'?1.25:.8));}

/* ───────── surface explorer ───────── */
function viewSurface(s){
 const list=pagesOf(s);const meta=SURF[s];
 const q=(state.pageFilter||'').toLowerCase();
 const p=list.find(x=>x.id===state.page)||list[0];state.page=p.id;
 const i=list.indexOf(p),prevP=list[i-1],nextP=list[i+1];
 const vis=list.filter(x=>!q||[x.id,x.title,x.purpose,...x.fields].join(' ').toLowerCase().includes(q));
 const wide=meta.kind==='desk';
 const reqs=p.refs.map(id=>reqById[id]).filter(Boolean);
 return `<div class="head"><div><div class="kicker">الصفحات وتجربة الاستخدام</div><h1>${meta.label}</h1><p>اختر صفحة لمعاينة تنظيمها، ثم راجع عناصرها وإجراءاتها وحالاتها. أرقام المعاينة بيانات توضيحية.</p></div></div>
 <div class="explorer ${wide?'wide':''}"><aside class="plist" aria-label="صفحات ${meta.label}">
  <div class="plist-filter">${I('search')}<input id="page-q" placeholder="تصفية الصفحات" value="${E(state.pageFilter||'')}" aria-label="تصفية الصفحات"></div>
  <select class="plist-select" id="page-select" aria-label="اختر صفحة">${list.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.id} · ${E(x.title)}</option>`).join('')}</select>
  ${wide?'<small>أو انتقل من القائمة الجانبية داخل اللوحة</small>':''}<nav>${vis.map(x=>`<a href="${pageHref(x)}" class="${x.id===p.id?'active':''}" ${x.id===p.id?'aria-current="page"':''}><span class="id">${x.id}</span><span>${E(x.title)}</span><i style="background:${prioColor[x.priority]}" title="${labels[x.priority]}"></i></a>`).join('')||'<div class="empty" style="padding:20px">لا يوجد تطابق في هذه الواجهة.</div>'}</nav></aside>
 <section style="min-width:0">
  <div class="page-h"><div><h2><span class="id" style="font-size:15px">${p.id}</span>${E(p.title)}${pill(p.priority)}</h2><p>${E(p.purpose)}</p></div>
  <div class="pager"><a href="${prevP?pageHref(prevP):'#'}" aria-disabled="${!prevP}">${I('chevR')}السابقة</a><a href="${nextP?pageHref(nextP):'#'}" aria-disabled="${!nextP}">التالية${I('chevL')}</a></div></div>
  <div class="workbench ${wide?'wide':''}">
   <div class="stage"><div class="stage-cap"><span>${I(wide?'monitor':'phoneDev')}معاينة تنظيم الصفحة · ${p.id} · تفاعل محلي توضيحي</span><span>بيانات توضيحية</span></div>${wide?desk(p):phone(p)}</div>
   <div class="spec">
    <article class="spec-card"><h3>عناصر الصفحة<span>${p.fields.length}</span></h3><ul>${p.fields.map(x=>`<li>${E(x)}</li>`).join('')}</ul></article>
    <article class="spec-card"><h3>الإجراءات<span>${p.actions.length}</span></h3><div class="tags">${p.actions.map(x=>`<span class="tag">${E(x)}</span>`).join('')}</div></article>
    <article class="spec-card"><h3>الحالات والصلاحيات</h3><ul>${p.states.map(x=>`<li>${E(x)}</li>`).join('')}</ul></article>
    <article class="spec-card"><h3>التنقل المرتبط</h3><div class="tags">${p.links.map(id=>{const q=pageById[id];return q?`<a class="tag" href="${pageHref(q)}">${E(q.title)}</a>`:'';}).join('')||'<span class="muted" style="font-size:14px">من القائمة الرئيسية لهذه الواجهة.</span>'}</div></article>
    <article class="spec-card"><h3>المتطلبات المرتبطة<span>${reqs.length}</span></h3><div class="tags">${reqs.map(r=>`<button class="tag id" data-scroll="req-${E(r.id)}">${E(r.id)}</button>`).join('')}</div></article>
   </div></div>
  <div class="linked-reqs"><div class="section-h"><h2>القواعد المرتبطة بالصفحة</h2><small>${reqs.length} متطلب</small></div>${reqs.map(r=>reqCard(r)).join('')}</div>
 </section></div>`;}

/* ───────── navigation, routing, search ───────── */
function buildNav(){
 const a=(href,label,icon,cnt,route)=>`<a href="${href}" data-route="${route}">${I(icon)}<span>${label}</span>${cnt!=null?`<span class="count">${cnt}</span>`:''}</a>`;
 $('#nav').innerHTML=`<div class="rail-group">${a('#overview','نظرة عامة','home',null,'overview')}${a('#requirements','المتطلبات','book',D.requirements.length,'requirements')}</div>
 <div class="rail-group"><span>الواجهات</span>${Object.entries(SURF).map(([id,s])=>a('#'+id,s.label,s.icon,pagesOf(id).length,id)).join('')}</div>
 <div class="rail-group"><span>القواعد المشتركة</span>${RULES.map(([id,l,ic])=>a('#'+id,l,ic,null,id)).join('')}</div>`;}
function crumbs(){const c=['<span>محلات</span>'];const r=state.route;
 if(SURF[r]){c.push(`<span>${SURF[r].label}</span>`);const p=pageById[state.page];if(p)c.push(`<b>${E(p.title)}</b>`);}
 else if(r==='requirements'){c.push('<b>المتطلبات</b>');}
 else{const x=RULES.find(x=>x[0]===r);c.push(`<b>${x?x[1]:'نظرة عامة'}</b>`);}
 $('#crumbs').innerHTML=c.join(I('chevL').replace('<svg','<svg style="width:12px;height:12px;opacity:.5"'));}
function render(){
 const m=$('#main');const r=state.route;
 m.innerHTML=r==='overview'?viewOverview():r==='requirements'?viewRequirements():SURF[r]?viewSurface(r):r==='finance'?viewFinance():r==='settings'?viewSettings():r==='reports'?viewReports():r==='diagrams'?viewDiagrams():r==='quality'?viewQuality():viewOverview();
 $$('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===r));
 crumbs();bindInputs();updateCalc();setupDiagram();document.body.classList.remove('menu-open');}
function goPage(id){const p=pageById[id];if(!p)return;location.hash=`${p.surface}/${id}`;}
function hashChange(){
 clearTimeout(toast.timer);$('#toast').classList.remove('show');
 const h=decodeURIComponent(location.hash.slice(1));
 if(h.startsWith('req-')){const id=h.slice(4);state.route='requirements';state.group='';state.priority='all';state.reqQuery='';render();const el=document.getElementById('req-'+id);if(el){el.open=true;el.scrollIntoView({block:'start'});el.classList.add('flash');}return;}
 let [route,sub]=h.split('/');
 if(route==='merchant'&&sub&&sub.startsWith('MD'))route='merchant-dash';
 const valid=['overview','requirements',...Object.keys(SURF),...RULES.map(x=>x[0])];
 const prev=state.route;state.route=valid.includes(route)?route:'overview';
 if(state.route==='requirements'){state.group=D.requirementGroups.some(g=>g[0]===sub)?sub:'';if(prev!=='requirements'){state.priority='all';state.reqQuery='';}}
 else if(SURF[state.route]){state.page=sub||'';if(prev!==state.route)state.pageFilter='';}
 else{state.priority='all';if(prev!==state.route)state.reqQuery='';}
 render();
 if(SURF[state.route]&&prev===state.route&&sub){const ph=$('.page-h');if(ph&&ph.getBoundingClientRect().top<0)ph.scrollIntoView({block:'start'});}
 else window.scrollTo(0,0);}

function keepFocus(id,fn){const el=$('#'+id);const pos=el?el.selectionStart:0;fn();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}}
function bindInputs(){
 const rq=$('#req-q');if(rq)rq.oninput=e=>{state.reqQuery=e.target.value.trim();keepFocus('req-q',render);};
 const rp=$('#rep-q');if(rp)rp.oninput=e=>{state.reqQuery=e.target.value.trim();keepFocus('rep-q',render);};
 const pq=$('#page-q');if(pq)pq.oninput=e=>{state.pageFilter=e.target.value;keepFocus('page-q',()=>{const nav=$('.plist nav');const tmp=document.createElement('div');tmp.innerHTML=viewSurface(state.route);nav.replaceWith($('.plist nav',tmp));});};
 const ps=$('#page-select');if(ps)ps.onchange=e=>goPage(e.target.value);
 $$('[id^=calc-]').filter(x=>x.tagName==='INPUT').forEach(x=>x.oninput=updateCalc);
 if($('#store-type')){$('#store-type').value=state.demo.storeType;$('#store-type').onchange=e=>{state.demo.storeType=e.target.value;render();};}
 if($('#order-mode')){$('#order-mode').value=state.demo.orderMode||'written';$('#order-mode').onchange=e=>{state.demo.orderMode=e.target.value;toast('تغيير الطريقة للطلبات الجديدة بعد جاهزية المنيو.');};}
 const price=$('#demo-price'),markup=$('#demo-markup');
 const refresh=()=>{if(price)state.demo.base=Math.max(0,Number(price.value)||0);if(markup)state.demo.markup=Math.max(0,Number(markup.value)||0);if($('#price-preview'))$('#price-preview').textContent=money(state.demo.base*(1+state.demo.markup/100));if($('#merchant-preview'))$('#merchant-preview').textContent=money(state.demo.base*state.demo.merchantRate/100);};
 if(price)price.oninput=refresh;if(markup)markup.oninput=refresh;
 if($('#merchant-rate'))$('#merchant-rate').oninput=e=>{state.demo.merchantRate=Math.max(0,Number(e.target.value)||0);refresh();};
 if($('#waiver'))$('#waiver').onchange=e=>{state.demo.waiver=e.target.checked;toast(e.target.checked?'إعفاء رسوم العقد فقط؛ الباقي كما هو.':'رسوم العقد تطبق على طلب الرابط.');};}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-page],[data-demo],[data-back],[data-priority],[data-group],[data-expand],[data-diagram],[data-store-tab],[data-scroll]');if(!t)return;
 if(t.matches('a[aria-disabled="true"]')){e.preventDefault();return;}
 const d=t.dataset;
 if(d.page){e.preventDefault();goPage(d.page);}
 else if(d.demo!==undefined){e.preventDefault();toast(d.demo+' — معاينة فقط، دون اتصال بالنظام الحقيقي.');}
 else if(d.back!==undefined){e.preventDefault();history.length>1?history.back():goPage(pagesOf(state.route)[0].id);}
 else if(d.priority){state.priority=d.priority;render();}
 else if(d.group!==undefined){location.hash=d.group?`requirements/${d.group}`:'requirements';}
 else if(d.expand){$$('.req').forEach(x=>x.open=d.expand==='1');}
 else if(d.diagram){state.diagram=d.diagram;render();}
 else if(d.storeTab){state.storeTab=d.storeTab;render();}
 else if(d.scroll){const el=document.getElementById(d.scroll);if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}}
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-date-filter]');if(s){const r=s.parentElement.querySelector('.custom-range');if(r)r.classList.toggle('on',s.value==='custom');}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('.m-toggle')){e.target.closest('.m-toggle').classList.toggle('on');}
 const seg=e.target.closest('.m-seg button,.m-chip,.d-tabs button:not([data-store-tab])');if(seg&&!seg.dataset.page){[...seg.parentElement.children].forEach(c=>c.classList.remove('on'));seg.classList.add('on');}});

/* global search */
function searchResults(q){q=q.trim().toLowerCase();if(!q)return '';
 const rs=D.requirements.filter(r=>[r.id,r.title,...r.rules].join(' ').toLowerCase().includes(q)).slice(0,7);
 const ps=D.pages.filter(p=>[p.id,p.title,p.purpose,...p.fields].join(' ').toLowerCase().includes(q)).slice(0,7);
 const ss=D.settings.filter(s=>s.join(' ').toLowerCase().includes(q)).slice(0,3);
 if(!rs.length&&!ps.length&&!ss.length)return '<div class="none">لا توجد نتيجة. جرّب معرّفًا مثل CUS-001 أو اسم صفحة.</div>';
 return (ps.length?`<h6>الصفحات</h6>${ps.map(p=>`<a href="${pageHref(p)}"><span class="id">${p.id}</span>${E(p.title)}<small>${SURF[p.surface].label}</small></a>`).join('')}`:'')+
  (rs.length?`<h6>المتطلبات</h6>${rs.map(r=>`<a href="#req-${r.id}"><span class="id">${r.id}</span>${E(r.title)}</a>`).join('')}`:'')+
  (ss.length?`<h6>الإعدادات</h6>${ss.map(s=>`<a href="#settings">${E(s[0])}<small>${E(s[1])}</small></a>`).join('')}`:'');}
const sInput=$('#search'),sRes=$('#results');let sIdx=-1;
sInput.oninput=()=>{sRes.innerHTML=searchResults(sInput.value);sRes.classList.toggle('open',!!sInput.value.trim());sIdx=-1;};
sInput.onkeydown=e=>{const items=$$('a',sRes);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sIdx=(sIdx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((a,i)=>a.classList.toggle('hl',i===sIdx));}
 else if(e.key==='Enter'){const a=items[sIdx]||items[0];if(a){location.hash=a.getAttribute('href').slice(1);close();}}
 else if(e.key==='Escape')close();};
function close(){sRes.classList.remove('open');sInput.value='';sInput.blur();}
sRes.addEventListener('click',e=>{if(e.target.closest('a'))setTimeout(close,0);});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))sRes.classList.remove('open');});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();sInput.focus();}if(e.key==='Escape')document.body.classList.remove('menu-open');});

$('#search-ic').outerHTML=I('search');
$('#menu').innerHTML=I('menu');$('#menu').onclick=()=>document.body.classList.toggle('menu-open');$('.rail-close').onclick=()=>document.body.classList.remove('menu-open');
const root=document.documentElement;
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const themeIcon=()=>$('#theme').innerHTML=I(isDark()?'sun':'moon');
try{const t=localStorage.getItem('mahallat-theme');if(t)root.dataset.theme=t;}catch(e){}
themeIcon();$('#theme').onclick=()=>{root.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('mahallat-theme',root.dataset.theme);}catch(e){}themeIcon();};
$('#print').innerHTML=I('print')+'طباعة';$('#print').onclick=()=>{$$('.req').forEach(d=>d.open=true);window.print();};
buildNav();window.addEventListener('hashchange',hashChange);hashChange();
